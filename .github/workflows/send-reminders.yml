name: Send Due Reminders

on:
  schedule:
    # Kept as a backup trigger — GitHub's own scheduler can be
    # significantly delayed for free-tier repos during busy periods
    # (confirmed via testing — gaps of 1-3+ hours observed instead of
    # the configured 5 min). The repository_dispatch trigger below
    # (pinged by an external free cron service) is now the PRIMARY,
    # more precise trigger.
    - cron: '*/5 * * * *'
  repository_dispatch:
    # No 'types' filter — accepts ANY repository_dispatch event.
    # (Previously filtered to types: [check-reminders], but the
    # actual event_type sent by cron-job.org apparently wasn't
    # matching that filter exactly, so dispatches were accepted by
    # GitHub's API — hence the 204 success responses — but silently
    # never triggered this workflow. Removing the filter avoids that
    # entire class of mismatch.)
  workflow_dispatch: # lets you also trigger it manually from the Actions tab, for testing

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reminder-script
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run reminder check
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: node check_reminders.js
