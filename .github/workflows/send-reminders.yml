name: Send Due Reminders

on:
  schedule:
    # Runs every 15 minutes, all day, every day — 100% free on
    # GitHub's Free plan (well within the included Actions minutes).
    - cron: '*/15 * * * *'
  workflow_dispatch: # lets you also trigger it manually from the Actions tab, for testing

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reminder-script
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run reminder check
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: node check_reminders.js
