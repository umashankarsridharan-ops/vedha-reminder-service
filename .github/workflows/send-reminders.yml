name: Send Due Reminders

on:
  schedule:
    # Runs every 5 minutes (GitHub's minimum allowed interval for
    # scheduled workflows) — reduces the worst-case delay between a
    # reminder's scheduled_time and when this check finds it, from up
    # to 15 min down to up to 5 min. Some additional jitter from
    # GitHub's own scheduler during busy periods is still possible —
    # that's an inherent trade-off of the free tier, documented by
    # GitHub itself, not something this workflow can fully control.
    - cron: '*/5 * * * *'
  workflow_dispatch: # lets you also trigger it manually from the Actions tab, for testing

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reminder-script
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run reminder check
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: node check_reminders.js
